<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vetrix AI — Chat</title>

<link rel="icon" type="image/png" href="vetrix-favicon-novo.png">
<link rel="shortcut icon" type="image/png" href="vetrix-favicon-novo.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#090807;
    color:#f4eee8;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

.sidebar{
    width:250px;
    background:#0d0a08;
    border-right:1px solid #302018;
    padding:22px 15px;
    display:flex;
    flex-direction:column;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 25px;
}

.brand img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.brand span{
    font-weight:bold;
    letter-spacing:1px;
}

.side-button{
    width:100%;
    background:transparent;
    color:#b9aaa0;
    border:1px solid transparent;
    padding:13px;
    text-align:left;
    border-radius:9px;
    margin-bottom:5px;
    cursor:pointer;
    font-size:14px;
}

.side-button:hover{
    background:#17100c;
    color:#fff;
}

.mode{
    margin-top:auto;
    border:1px solid #493022;
    color:#f4eee8;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:70px;
    border-bottom:1px solid #302018;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:#0b0908;
}

.top-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.top-left img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.top-left strong{
    letter-spacing:1px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.user{
    padding:9px 14px;
    border:1px solid #3b281d;
    border-radius:8px;
    color:#d7cbc2;
}

.home{
    color:#ff7a1a;
    text-decoration:none;
    font-size:14px;
}

.chat-area{
    flex:1;
    overflow:auto;
    padding:45px 20px 120px;
}

.center{
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin-bottom:35px;
}

.welcome img{
    width:125px;
    height:125px;
    object-fit:contain;
    margin-bottom:18px;
}

.welcome h1{
    font-size:35px;
    margin-bottom:10px;
}

.welcome p{
    color:#9e9188;
    line-height:1.6;
}

.prompts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:25px;
}

.prompt{
    background:#110d0a;
    border:1px solid #38251a;
    color:#d8cbc1;
    border-radius:11px;
    padding:16px;
    text-align:left;
    cursor:pointer;
}

.prompt:hover{
    border-color:#ff7a1a;
}

.input-box{
    background:#110d0a;
    border:1px solid #493022;
    border-radius:15px;
    padding:12px;
}

textarea{
    width:100%;
    min-height:100px;
    resize:none;
    background:transparent;
    border:0;
    outline:none;
    color:#f4eee8;
    font-family:inherit;
    font-size:15px;
    padding:8px;
}

textarea::placeholder{
    color:#776b63;
}

.input-bottom{
    display:flex;
    justify-content:flex-end;
}

.send{
    background:#ff7a1a;
    color:#160d08;
    border:0;
    border-radius:9px;
    padding:11px 19px;
    font-weight:bold;
    cursor:pointer;
}

.response{
    display:none;
    margin-top:25px;
    background:#110d0a;
    border:1px solid #38251a;
    border-radius:13px;
    padding:20px;
    line-height:1.7;
}

.response strong{
    color:#ff7a1a;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.setup{
    width:min(620px,92%);
    background:#110d0a;
    border:1px solid #493022;
    border-radius:18px;
    padding:35px;
}

.setup h2{
    font-size:27px;
    margin-bottom:10px;
}

.setup p{
    color:#9e9188;
    margin-bottom:25px;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.option{
    background:#0d0a08;
    color:#f4eee8;
    border:1px solid #38251a;
    border-radius:11px;
    padding:17px;
    cursor:pointer;
    text-align:left;
}

.option:hover{
    border-color:#ff7a1a;
}

.hidden{
    display:none;
}

input{
    width:100%;
    background:#0d0a08;
    border:1px solid #493022;
    color:#fff;
    border-radius:9px;
    padding:13px;
    margin-top:10px;
    outline:none;
}

.continue{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#ff7a1a;
    color:#160d08;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:750px){
    .sidebar{
        display:none;
    }

    .prompts,
    .options{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 15px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="brand">
        <img src="vetrix-logo-final.png" alt="Vetrix AI">
        <span>VETRIX AI</span>
    </div>

    <button class="side-button" onclick="inicio()">⌂ Início</button>
    <button class="side-button" onclick="novaConversa()">＋ Nova conversa</button>
    <button class="side-button" onclick="mostrarHistorico()">◷ Histórico</button>
    <button class="side-button" onclick="configuracoes()">⚙ Configurações</button>
    <button class="side-button" onclick="ajuda()">? Ajuda</button>

    <button class="side-button mode" onclick="trocarModo()">
        Modo: <span id="modoTexto">Estudo</span>
    </button>

</aside>

<main class="main">

<header class="topbar">

    <div class="top-left">
        <img src="vetrix-logo-final.png" alt="Vetrix AI">
        <strong>VETRIX AI</strong>
    </div>

    <div class="top-right">
        <span class="user">Luís⌄</span>
        <a class="home" href="index.html">INÍCIO</a>
    </div>

</header>

<div class="chat-area">

<div class="center">

<div class="welcome">

    <img src="vetrix-logo-final.png" alt="Vetrix AI">

    <h1>Olá, Luís!</h1>

    <p id="descricaoModo">
        Seu assistente inteligente para estudar, criar e resolver problemas.
    </p>

</div>

<div class="prompts">

    <button class="prompt" onclick="usarPrompt('Explique um assunto de forma fácil')">
        📚 Explique um assunto
    </button>

    <button class="prompt" onclick="usarPrompt('Me ajude com uma atividade')">
        📝 Ajude com uma atividade
    </button>

    <button class="prompt" onclick="usarPrompt('Crie uma ideia para um projeto')">
        💡 Crie uma ideia
    </button>

    <button class="prompt" onclick="usarPrompt('Me ajude a pesquisar um assunto')">
        🔎 Pesquise um assunto
    </button>

</div>

<div class="input-box">

    <textarea
        id="mensagem"
        placeholder="Digite sua mensagem..."
        onkeydown="teclaEnter(event)"
    ></textarea>

    <div class="input-bottom">
        <button class="send" onclick="enviar()">Enviar</button>
    </div>

</div>

<div class="response" id="resposta"></div>

</div>

</div>

</main>

</div>

<div class="overlay" id="overlay">

<div class="setup">

    <h2>Como você pretende usar o Vetrix?</h2>

    <p>Isso ajuda a personalizar sua experiência.</p>

    <div class="options">

        <button class="option" onclick="selecionarTipo('fundamental')">
            📚 Fundamental II
        </button>

        <button class="option" onclick="selecionarTipo('medio')">
            🎓 Ensino Médio
        </button>

        <button class="option" onclick="selecionarTipo('faculdade')">
            🏛️ Faculdade
        </button>

        <button class="option" onclick="selecionarTipo('base')">
            💻 Não sou estudante
        </button>

    </div>

    <div id="subEscolha" class="hidden">

        <p id="pergunta"></p>

        <div id="subOpcoes" class="options"></div>

        <input
            id="outros"
            class="hidden"
            placeholder="Digite sua resposta"
        >

        <button class="continue" onclick="finalizarPerfil()">
            Continuar
        </button>

    </div>

</div>

</div>

<script>

let perfil = {};
let tipoSelecionado = "";

function selecionarTipo(tipo){

    tipoSelecionado = tipo;

    const sub = document.getElementById("subEscolha");
    const pergunta = document.getElementById("pergunta");
    const opcoes = document.getElementById("subOpcoes");

    opcoes.innerHTML = "";

    sub.classList.remove("hidden");

    if(tipo === "fundamental"){

        pergunta.textContent = "Qual é o seu ano?";

        ["6º ano","7º ano","8º ano","9º ano"].forEach(x=>{
            criarOpcao(x);
        });

    }

    else if(tipo === "medio"){

        pergunta.textContent = "Qual é o seu ano?";

        ["1º ano","2º ano","3º ano"].forEach(x=>{
            criarOpcao(x);
        });

    }

    else if(tipo === "faculdade"){

        pergunta.textContent = "Qual é o seu curso?";

        criarOpcao("Outro");

        document.getElementById("outros").classList.remove("hidden");
    }

    else{

        pergunta.textContent = "O que você pretende fazer com o Vetrix?";

        [
            "Trabalho e produtividade",
            "Criar ideias e projetos",
            "Pesquisar e aprender",
            "Tecnologia e programação",
            "Escrever e criar conteúdos",
            "Criatividade",
            "Conversar e tirar dúvidas"
        ].forEach(x=>{
            criarOpcao(x);
        });

        criarOpcao("Outros");
    }
}

function criarOpcao(texto){

    const opcoes = document.getElementById("subOpcoes");

    const botao = document.createElement("button");

    botao.className = "option";
    botao.textContent = texto;

    botao.onclick = function(){

        perfil.escolha = texto;

        if(texto === "Outros" || texto === "Outro"){
            document.getElementById("outros").classList.remove("hidden");
        }
    };

    opcoes.appendChild(botao);
}

function finalizarPerfil(){

    const outro = document.getElementById("outros");

    if(outro.value.trim()){
        perfil.escolha = outro.value.trim();
    }

    perfil.tipo = tipoSelecionado;

    localStorage.setItem(
        "vetrixPerfil",
        JSON.stringify(perfil)
    );

    localStorage.setItem(
        "primeiroAcessoConcluido",
        "true"
    );

    document.getElementById("overlay").style.display = "none";

    aplicarPerfil();
}

function aplicarPerfil(){

    const salvo = localStorage.getItem("vetrixPerfil");

    if(!salvo) return;

    perfil = JSON.parse(salvo);

    const modo = perfil.tipo === "base" ? "Base" : "Estudo";

    document.getElementById("modoTexto").textContent = modo;

    if(modo === "Base"){
        document.getElementById("descricaoModo").textContent =
            "Seu assistente inteligente para criar, pesquisar, trabalhar e resolver problemas.";
    }else{
        document.getElementById("descricaoModo").textContent =
            "Seu assistente inteligente para estudar, aprender e resolver problemas.";
    }
}

function trocarModo(){

    if(perfil.tipo === "base"){
        perfil.tipo = "fundamental";
    }else{
        perfil.tipo = "base";
    }

    localStorage.setItem(
        "vetrixPerfil",
        JSON.stringify(perfil)
    );

    aplicarPerfil();
}

function usarPrompt(texto){

    document.getElementById("mensagem").value = texto;

    document.getElementById("mensagem").focus();
}

function enviar(){

    const campo = document.getElementById("mensagem");
    const texto = campo.value.trim();

    if(!texto) return;

    const resposta = document.getElementById("resposta");

    resposta.style.display = "block";

    resposta.innerHTML =
        "<strong>Vetrix AI</strong><br><br>" +
        "Esta é uma resposta de demonstração do Vetrix AI.<br><br>" +
        "A API será conectada posteriormente para que o Vetrix possa responder às mensagens de forma inteligente.";

    campo.value = "";
}

function teclaEnter(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        enviar();
    }
}

function novaConversa(){

    document.getElementById("mensagem").value = "";
    document.getElementById("resposta").style.display = "none";
}

function inicio(){

    window.location.href = "index.html";
}

function mostrarHistorico(){

    alert("O histórico de conversas será conectado posteriormente.");
}

function configuracoes(){

    alert("As configurações do Vetrix serão adicionadas posteriormente.");
}

function ajuda(){

    alert("O Vetrix está em desenvolvimento. Algumas funções serão conectadas posteriormente.");
}

window.onload = function(){

    const concluido =
        localStorage.getItem("primeiroAcessoConcluido");

    if(concluido === "true"){

        document.getElementById("overlay").style.display = "none";

        aplicarPerfil();
    }

};

</script>

</body>
</html>
