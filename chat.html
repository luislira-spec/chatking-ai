<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vetrix AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080706;
    color: #f2ede6;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
}

/* =========================
   TOPO
========================= */

.topbar {
    height: 90px;
    border-bottom: 1px solid #3a2416;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 32px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.logo img {
    width: 48px;
    height: 48px;
    object-fit: contain;

    filter: drop-shadow(0 0 8px rgba(255,122,26,0.25));
}

.ai {
    color: #ff7a1a;
}

.topbar-right {
    display: flex;
    gap: 12px;
}

.top-btn {
    border: 1px solid #7a4420;
    border-radius: 6px;

    padding: 11px 17px;

    color: #f2ede6;
    background: transparent;

    text-decoration: none;
    font-size: 14px;

    cursor: pointer;
}

.top-btn:hover {
    border-color: #ff7a1a;
}

.top-btn.inicio {
    border-color: #ff7a1a;
    color: #ff7a1a;
}

/* =========================
   CORPO
========================= */

.body-layout {
    display: flex;
    min-height: calc(100vh - 90px);
}

/* =========================
   MENU LATERAL
========================= */

.sidebar {
    width: 250px;

    border-right: 1px solid #3a2416;

    padding: 24px 16px;

    flex-shrink: 0;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 14px;

    border-radius: 6px;

    color: #a89a8c;

    font-size: 15px;

    margin-bottom: 6px;

    cursor: pointer;
}

.nav-item:hover {
    background: rgba(255,122,26,0.06);
    color: #f2ede6;
}

.nav-item.active {
    background: rgba(255,122,26,0.09);

    border: 1px solid #7a4420;

    color: #ff7a1a;
}

/* =========================
   ÁREA PRINCIPAL
========================= */

.main {
    flex: 1;

    padding: 55px 40px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

/* =========================
   LOGO CENTRAL
========================= */

.hero-logo {
    width: 130px;
    height: 130px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;
}

.hero-logo img {
    width: 130px;
    height: 130px;

    object-fit: contain;

    filter: drop-shadow(0 0 12px rgba(255,122,26,0.25));
}

/* =========================
   TÍTULO
========================= */

h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

h1 span {
    color: #ff7a1a;
}

.subtitle {
    font-size: 19px;
    margin-bottom: 10px;
}

.subtitle span {
    color: #ff7a1a;
    font-weight: 600;
}

.description {
    max-width: 620px;

    color: #a89a8c;

    font-size: 15px;

    line-height: 1.6;

    margin-bottom: 42px;
}

/* =========================
   CAIXA DE PERGUNTA
========================= */

.input-row {
    width: 100%;
    max-width: 900px;

    display: flex;
    align-items: center;

    gap: 12px;

    border: 1px solid #7a4420;

    border-radius: 8px;

    padding: 12px 14px 12px 18px;

    background: #120d0a;
}

.input-row:focus-within {
    border-color: #ff7a1a;
    box-shadow: 0 0 0 2px rgba(255,122,26,0.08);
}

.input-icon {
    font-size: 20px;
}

#pergunta {
    flex: 1;

    height: 44px;

    background: transparent;

    border: none;
    outline: none;

    color: #f2ede6;

    font-size: 15px;
}

#pergunta::placeholder {
    color: #756a61;
}

.send-btn {
    width: 42px;
    height: 42px;

    border: none;

    border-radius: 6px;

    background: #ff7a1a;

    color: #1a0e05;

    font-size: 18px;

    cursor: pointer;
}

.send-btn:hover {
    opacity: 0.9;
}

/* =========================
   RESPOSTAS
========================= */

#respostas {
    width: 100%;
    max-width: 900px;

    margin-top: 20px;
}

.mensagem {
    text-align: left;

    padding: 15px 18px;

    margin-bottom: 10px;

    border: 1px solid #3a2416;

    border-radius: 7px;

    background: #100c09;

    line-height: 1.5;
}

.mensagem.usuario {
    border-left: 3px solid #ff7a1a;
}

.mensagem.vetrix {
    border-left: 3px solid #7a4420;
}

/* =========================
   RODAPÉ
========================= */

.footer {
    margin-top: auto;

    padding-top: 45px;

    color: #756a61;

    font-size: 13px;
}

.footer b {
    color: #f2ede6;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .topbar {
        height: 80px;
        padding: 0 15px;
    }

    .logo {
        font-size: 19px;
    }

    .logo img {
        width: 38px;
        height: 38px;
    }

    .topbar-right {
        gap: 5px;
    }

    .top-btn {
        padding: 9px 10px;
        font-size: 12px;
    }

    .sidebar {
        display: none;
    }

    .body-layout {
        min-height: calc(100vh - 80px);
    }

    .main {
        padding: 45px 18px 20px;
    }

    .hero-logo,
    .hero-logo img {
        width: 95px;
        height: 95px;
    }

    h1 {
        font-size: 29px;
    }

    .description {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     TOPO
========================= -->

<header class="topbar">

    <div class="logo">

        <img src="vetrix-logo-final.png" alt="Logo Vetrix AI">

        <div>
            VETRIX <span class="ai">AI</span>
        </div>

    </div>

    <div class="topbar-right">

        <div class="top-btn">
            👤 Luís⌄
        </div>

        <a href="index.html" class="top-btn inicio">
            🏠 INÍCIO
        </a>

    </div>

</header>


<!-- =========================
     CORPO
========================= -->

<div class="body-layout">


    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="nav-item active">
            🏠 Início
        </div>

        <div class="nav-item" onclick="novaConversa()">
            💬 Nova conversa
        </div>

        <div class="nav-item">
            📖 Histórico
        </div>

        <div class="nav-item">
            ⚙️ Configurações
        </div>

        <div class="nav-item">
            ❓ Ajuda
        </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->

    <main class="main">

        <div class="hero-logo">

            <img
                src="vetrix-logo-final.png"
                alt="Vetrix AI"
            >

        </div>


        <h1>
            Olá, <span>Luís!</span>
        </h1>


        <div class="subtitle">
            Você está no <span>modo base.</span>
        </div>


        <p class="description">
            Pode fazer perguntas, tirar dúvidas, pedir ideias,
            conversar e muito mais. Estou aqui para te ajudar!
        </p>


        <!-- CAIXA DE PERGUNTA -->

        <div class="input-row">

            <div class="input-icon">
                ✨
            </div>

            <input
                id="pergunta"
                type="text"
                placeholder="Digite sua pergunta..."
            >

            <button
                class="send-btn"
                onclick="enviarPergunta()"
            >
                ➤
            </button>

        </div>


        <!-- RESPOSTAS -->

        <div id="respostas"></div>


        <!-- RODAPÉ -->

        <div class="footer">
            Feito por <b>Luís Felipe Lira e Daniel Perez.</b>
        </div>

    </main>

</div>


<script>

function enviarPergunta() {

    const campo = document.getElementById("pergunta");

    const texto = campo.value.trim();

    if (texto === "") {
        return;
    }

    const respostas = document.getElementById("respostas");


    // PERGUNTA DO USUÁRIO

    const pergunta = document.createElement("div");

    pergunta.className = "mensagem usuario";

    pergunta.textContent = texto;

    respostas.appendChild(pergunta);


    campo.value = "";


    // RESPOSTA TEMPORÁRIA

    const resposta = document.createElement("div");

    resposta.className = "mensagem vetrix";

    resposta.textContent =
        "Recebi sua pergunta! A inteligência do Vetrix será conectada quando a API estiver configurada.";

    respostas.appendChild(resposta);


    resposta.scrollIntoView({
        behavior: "smooth"
    });
}


function novaConversa() {

    document.getElementById("respostas").innerHTML = "";

    document.getElementById("pergunta").value = "";

    document.getElementById("pergunta").focus();
}


document
    .getElementById("pergunta")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            enviarPergunta();

        }

    });

</script>

</body>
</html>
