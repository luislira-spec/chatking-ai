<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat — Vetrix AI</title>

<!-- Ícone da aba -->
<link rel="icon" type="image/png" href="vetrix-logo-final.png">
<link rel="shortcut icon" type="image/png" href="vetrix-logo-final.png">

<style>

:root{
    --bg:#090807;
    --panel:#110d0a;
    --panel2:#15100c;
    --border:#3a2518;
    --orange:#ff7a1a;
    --text:#f4eee8;
    --dim:#a99b8f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}

/* TOPO */

.topbar{
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid var(--border);
    background:#0d0907;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:21px;
    font-weight:750;
}

.logo img{
    width:67px;
    height:67px;
    object-fit:contain;
}

.ai{
    color:var(--orange);
}

.top-actions{
    display:flex;
    gap:9px;
}

.pill{
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:transparent;
    color:var(--text);
    cursor:pointer;
}

.pill:hover{
    border-color:var(--orange);
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 82px);
}

/* SIDEBAR */

.sidebar{
    width:250px;
    padding:22px 15px;
    border-right:1px solid var(--border);
    background:#0d0907;
}

.nav{
    width:100%;
    padding:12px 14px;
    margin-bottom:7px;
    text-align:left;
    border:1px solid transparent;
    border-radius:8px;
    background:transparent;
    color:var(--dim);
    cursor:pointer;
    font-size:14px;
}

.nav:hover,
.nav.active{
    border-color:#70401f;
    color:var(--orange);
    background:rgba(255,122,26,.07);
}

.mode-area{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--border);
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    padding:48px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

.hero-logo{
    width:145px;
    height:145px;
    object-fit:contain;
}

h1{
    font-size:34px;
    margin:8px 0 5px;
}

.mode-text{
    color:var(--dim);
    margin:0 0 10px;
}

.mode{
    color:var(--orange);
}

.description{
    max-width:700px;
    color:var(--dim);
    line-height:1.6;
    margin:0 0 26px;
}

/* QUICK */

.quick{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin-bottom:25px;
}

.quick button{
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel);
    color:var(--dim);
    cursor:pointer;
}

.quick button:hover{
    color:var(--text);
    border-color:#70401f;
}

/* INPUT */

.input-box{
    width:min(900px,100%);
    display:flex;
    gap:10px;
    padding:12px 13px;
    border:1px solid #70401f;
    border-radius:10px;
    background:var(--panel);
}

textarea{
    flex:1;
    min-height:30px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font:inherit;
}

textarea::placeholder{
    color:#766a60;
}

.send{
    width:42px;
    height:42px;
    border:0;
    border-radius:8px;
    background:var(--orange);
    color:#1b0c05;
    font-weight:bold;
    cursor:pointer;
}

.send:hover{
    filter:brightness(1.08);
}

/* RESPOSTA */

.response{
    display:none;
    width:min(900px,100%);
    margin-top:18px;
    padding:20px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    text-align:left;
    line-height:1.6;
}

/* ONBOARDING */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(6px);
}

.overlay.show{
    display:flex;
}

.card{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    padding:30px;
    border:1px solid #70401f;
    border-radius:14px;
    background:#110b08;
    box-shadow:0 25px 80px #000;
}

.progress{
    height:4px;
    margin-bottom:25px;
    border-radius:20px;
    background:#291b12;
}

.bar{
    height:100%;
    width:50%;
    background:var(--orange);
    border-radius:20px;
}

h2{
    margin:0 0 8px;
}

.sub{
    color:var(--dim);
    line-height:1.5;
    margin-bottom:22px;
}

/* OPÇÕES */

.options,
.goals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option,
.goal{
    padding:15px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    text-align:left;
}

.option:hover,
.goal:hover{
    border-color:#70401f;
}

.option.selected{
    border-color:var(--orange);
    background:rgba(255,122,26,.08);
}

.option small{
    display:block;
    color:var(--dim);
    margin-top:5px;
}

.goal{
    display:flex;
    gap:9px;
    align-items:flex-start;
}

.goal input{
    accent-color:var(--orange);
    margin-top:3px;
}

/* FORM */

.form{
    margin-top:12px;
}

.form label{
    display:block;
    color:var(--dim);
    font-size:14px;
    margin:12px 0 7px;
}

.form input,
.form select,
.form textarea{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel);
    color:var(--text);
    outline:none;
}

.form input:focus,
.form select:focus,
.form textarea:focus{
    border-color:var(--orange);
}

.form textarea{
    min-height:110px;
}

.other{
    display:none;
}

.other.show{
    display:block;
}

/* AÇÕES */

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.back,
.continue{
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.back{
    background:transparent;
    color:var(--dim);
    border:1px solid var(--border);
}

.continue{
    background:var(--orange);
    border:1px solid var(--orange);
    color:#1a0e05;
    font-weight:700;
}

.continue:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* MOBILE */

@media(max-width:750px){

    .sidebar{
        width:72px;
        padding:15px 8px;
    }

    .nav{
        padding:12px 5px;
        text-align:center;
    }

    .label{
        display:none;
    }

    .topbar{
        padding:0 14px;
    }

    .top-actions .pill{
        padding:7px 9px;
        font-size:12px;
    }

    .main{
        padding:35px 18px;
    }

    .options,
    .goals{
        grid-template-columns:1fr;
    }

    .card{
        padding:22px;
    }

    .hero-logo{
        width:125px;
        height:125px;
    }

    h1{
        font-size:28px;
    }
}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">

        <img src="vetrix-logo-final.png" alt="Vetrix AI">

        <span>
            VETRIX <span class="ai">AI</span>
        </span>

    </div>


    <div class="top-actions">

        <button class="pill">
            👤 Luís⌄
        </button>

        <button class="pill" onclick="location.href='index.html'">
            🏠 INÍCIO
        </button>

    </div>

</header>


<div class="layout">


<aside class="sidebar">

    <button class="nav active" onclick="novaConversa()">
        🏠 <span class="label">Início</span>
    </button>

    <button class="nav" onclick="novaConversa()">
        💬 <span class="label">Nova conversa</span>
    </button>

    <button class="nav" onclick="mostrarHistorico()">
        📖 <span class="label">Histórico</span>
    </button>

    <button class="nav" onclick="configuracoes()">
        ⚙️ <span class="label">Configurações</span>
    </button>

    <button class="nav" onclick="ajuda()">
        ❓ <span class="label">Ajuda</span>
    </button>


    <div class="mode-area">

        <button class="nav" id="modeButton" onclick="trocarModo()">
            📚 <span class="label">Modo Estudo</span>
        </button>

    </div>

</aside>


<main class="main">


    <img
        class="hero-logo"
        id="heroLogo"
        src="vetrix-logo-final.png"
        alt="Vetrix AI"
    >


    <h1>
        Olá, <span class="ai">Luís!</span>
    </h1>


    <p class="mode-text">
        Você está no
        <span class="mode" id="modeText">modo base</span>.
    </p>


    <p class="description" id="description">
        Pode fazer perguntas, tirar dúvidas, pedir ideias,
        conversar e muito mais. Estou aqui para te ajudar.
    </p>


    <div class="quick">

        <button onclick="preencher('Explique este assunto para mim de forma simples.')">
            Explicar
        </button>

        <button onclick="preencher('Me ajude a criar uma ideia de projeto.')">
            Criar uma ideia
        </button>

        <button onclick="preencher('Pesquise e me explique este assunto.')">
            Pesquisar
        </button>

        <button onclick="preencher('Me ajude com tecnologia e programação.')">
            Tecnologia
        </button>

    </div>


    <div class="input-box">

        <textarea
            id="question"
            placeholder="Digite sua pergunta para o Vetrix..."
        ></textarea>

        <button class="send" onclick="enviar()">
            ➤
        </button>

    </div>


    <div class="response" id="response"></div>


</main>

</div>


<!-- ONBOARDING -->

<div class="overlay" id="overlay">

<div class="card">

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>


    <div id="content"></div>


    <div class="actions">

        <button
            class="back"
            id="back"
            onclick="voltar()"
        >
            Voltar
        </button>

        <button
            class="continue"
            id="continue"
            onclick="continuar()"
        >
            Continuar →
        </button>

    </div>

</div>

</div>


<script>

/* =========================
   PERFIL
========================= */

const KEY = "vetrixPerfil";

let perfil = JSON.parse(
    localStorage.getItem(KEY) || "null"
);


let dados = {
    modo:null,
    nivel:null,
    serie:"",
    curso:"",
    periodo:"",
    objetivos:[],
    outroObjetivo:"",
    primeiroAcessoConcluido:false
};


let etapa = 1;


/* =========================
   URL
========================= */

const params = new URLSearchParams(
    window.location.search
);

const entradaModo = params.get("modo");
const entradaNivel = params.get("nivel");


/* =========================
   ELEMENTOS
========================= */

const overlay =
    document.getElementById("overlay");

const content =
    document.getElementById("content");

const cont =
    document.getElementById("continue");

const back =
    document.getElementById("back");

const bar =
    document.getElementById("bar");


/* =========================
   SEGURANÇA
========================= */

function esc(text){

    return String(text || "")
        .replace(/[&<>"']/g, function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m];

        });

}


/* =========================
   ONBOARDING
========================= */

function iniciarOnboarding(){

    dados = {
        modo:entradaModo || null,
        nivel:entradaNivel || null,
        serie:"",
        curso:"",
        periodo:"",
        objetivos:[],
        outroObjetivo:"",
        primeiroAcessoConcluido:false
    };

    etapa = 1;

    render();

    overlay.classList.add("show");
}


/* =========================
   RENDER
========================= */

function render(){

    back.style.display =
        etapa === 1 ? "none" : "block";

    bar.style.width =
        etapa === 1 ? "50%" : "100%";


    if(etapa === 1){

        /*
        Se veio da página inicial
        como modo base, vai direto
        para os objetivos.
        */

        if(dados.modo === "base"){

            renderObjetivos();

            return;
        }


        content.innerHTML = `

            <h2>
                Como você pretende usar o Vetrix?
            </h2>

            <p class="sub">
                Escolha seu nível de estudo para que
                o Vetrix possa adaptar melhor as respostas.
            </p>

            <div class="options">

                <button
                    class="option ${dados.nivel==="fundamental" ? "selected" : ""}"
                    onclick="selecionarNivel('fundamental',this)"
                >
                    <b>📘 Fundamental II</b>
                    <small>6º, 7º, 8º ou 9º ano</small>
                </button>


                <button
                    class="option ${dados.nivel==="medio" ? "selected" : ""}"
                    onclick="selecionarNivel('medio',this)"
                >
                    <b>🎓 Ensino Médio</b>
                    <small>1º, 2º ou 3º ano</small>
                </button>


                <button
                    class="option ${dados.nivel==="faculdade" ? "selected" : ""}"
                    onclick="selecionarNivel('faculdade',this)"
                >
                    <b>🏫 Faculdade</b>
                    <small>Curso e período</small>
                </button>


                <button
                    class="option ${dados.modo==="base" ? "selected" : ""}"
                    onclick="selecionarBase(this)"
                >
                    <b>🌎 Não sou estudante</b>
                    <small>Usar o Vetrix no modo base</small>
                </button>

            </div>
        `;


        cont.disabled =
            !dados.nivel &&
            dados.modo !== "base";

        return;
    }


    if(dados.modo === "base"){

        renderObjetivos();

    }else{

        renderEstudante();

    }

}


/* =========================
   NÍVEL
========================= */

function selecionarNivel(nivel, elemento){

    dados.modo = "estudo";

    dados.nivel = nivel;

    document
        .querySelectorAll(".option")
        .forEach(function(x){
            x.classList.remove("selected");
        });

    elemento.classList.add("selected");

    cont.disabled = false;
}


/* =========================
   BASE
========================= */

function selecionarBase(elemento){

    dados.modo = "base";

    dados.nivel = null;

    document
        .querySelectorAll(".option")
        .forEach(function(x){
            x.classList.remove("selected");
        });

    elemento.classList.add("selected");

    cont.disabled = false;
}


/* =========================
   ESTUDANTE
========================= */

function renderEstudante(){

    if(
        dados.nivel === "fundamental" ||
        dados.nivel === "medio"
    ){

        const titulo =
            dados.nivel === "fundamental"
            ? "Qual é o seu ano escolar?"
            : "Qual é o seu ano do Ensino Médio?";


        const opcoes =
            dados.nivel === "fundamental"
            ? ["6º ano","7º ano","8º ano","9º ano"]
            : ["1º ano","2º ano","3º ano"];


        content.innerHTML = `

            <h2>${titulo}</h2>

            <p class="sub">
                Assim o Vetrix consegue adaptar melhor
                o nível das explicações.
            </p>

            <div class="form">

                <label>Ano</label>

                <select id="serie">

                    <option value="">
                        Selecione...
                    </option>

                    ${opcoes.map(function(x){

                        return `
                            <option value="${x}">
                                ${x}
                            </option>
                        `;

                    }).join("")}

                </select>

            </div>
        `;


        document.getElementById("serie").value =
            dados.serie || "";

    }else{

        content.innerHTML = `

            <h2>
                Conte um pouco sobre sua faculdade
            </h2>

            <p class="sub">
                Informe seu curso e, se quiser,
                seu semestre/período.
            </p>

            <div class="form">

                <label>Curso</label>

                <input
                    id="curso"
                    placeholder="Ex.: Engenharia de Computação"
                >


                <label>
                    Semestre/período (opcional)
                </label>

                <input
                    id="periodo"
                    placeholder="Ex.: 3º semestre"
                >

            </div>
        `;


        document.getElementById("curso").value =
            dados.curso || "";

        document.getElementById("periodo").value =
            dados.periodo || "";

    }

}


/* =========================
   OBJETIVOS
========================= */

function renderObjetivos(){

    const objetivos = [

        "💼 Trabalho e produtividade",
        "💡 Criar ideias e projetos",
        "🔎 Pesquisar e aprender sobre assuntos",
        "💻 Tecnologia e programação",
        "✍️ Escrever e criar conteúdos",
        "🎨 Criatividade",
        "💬 Conversar e tirar dúvidas",
        "➕ Outros"

    ];


    content.innerHTML = `

        <h2>
            O que você pretende fazer com o Vetrix?
        </h2>

        <p class="sub">
            Você pode escolher uma ou várias opções.
        </p>


        <div class="goals">

            ${objetivos.map(function(texto){

                const valor =
                    texto.replace(/^.+? /,"");

                return `

                    <label class="goal">

                        <input
                            type="checkbox"
                            value="${esc(valor)}"
                            ${
                                dados.objetivos.includes(valor)
                                ? "checked"
                                : ""
                            }
                            onchange="atualizarObjetivos()"
                        >

                        <span>${texto}</span>

                    </label>
                `;

            }).join("")}

        </div>


        <div
            class="other ${
                dados.objetivos.includes("Outros")
                ? "show"
                : ""
            }"
            id="other"
        >

            <div class="form">

                <label>
                    Conte para o Vetrix o que você pretende fazer:
                </label>

                <textarea
                    id="otherText"
                    placeholder="Ex.: Quero usar o Vetrix para organizar meus projetos."
                >${esc(dados.outroObjetivo)}</textarea>

            </div>

        </div>

    `;


    atualizarObjetivos();

}


/* =========================
   ATUALIZAR OBJETIVOS
========================= */

function atualizarObjetivos(){

    dados.objetivos =
        Array.from(
            document.querySelectorAll(
                ".goal input:checked"
            )
        ).map(function(input){

            return input.value;

        });


    const other =
        document.getElementById("other");


    if(other){

        other.classList.toggle(
            "show",
            dados.objetivos.includes("Outros")
        );

    }


    const text =
        document.getElementById("otherText");


    if(text){

        dados.outroObjetivo = text.value;

        text.oninput =
            atualizarObjetivos;

    }


    cont.disabled =
        dados.objetivos.length === 0 ||
        (
            dados.objetivos.includes("Outros") &&
            !dados.outroObjetivo.trim()
        );

}


/* =========================
   CONTINUAR
========================= */

function continuar(){

    if(etapa === 1){

        if(dados.modo === "base"){

            etapa = 2;

            render();

            return;
        }


        if(!dados.nivel){

            return;
        }


        etapa = 2;

        render();

        return;

    }


    if(dados.modo === "estudo"){

        if(dados.nivel === "faculdade"){

            dados.curso =
                document.getElementById("curso")
                .value
                .trim();

            dados.periodo =
                document.getElementById("periodo")
                .value
                .trim();


            if(!dados.curso){

                alert(
                    "Digite pelo menos o seu curso."
                );

                return;
            }

        }else{

            dados.serie =
                document.getElementById("serie")
                .value;


            if(!dados.serie){

                alert(
                    "Escolha o seu ano escolar."
                );

                return;
            }

        }

    }else{

        atualizarObjetivos();

        if(cont.disabled){

            return;
        }

    }


    dados.primeiroAcessoConcluido = true;


    localStorage.setItem(
        KEY,
        JSON.stringify(dados)
    );


    perfil = dados;


    overlay.classList.remove("show");


    aplicarPerfil();

}


/* =========================
   VOLTAR
========================= */

function voltar(){

    etapa = 1;

    render();

}


/* =========================
   APLICAR PERFIL
========================= */

function aplicarPerfil(){

    if(!perfil){

        return;
    }


    document.getElementById("modeText")
        .textContent =
        perfil.modo === "estudo"
        ? "modo estudo"
        : "modo base";


    const description =
        document.getElementById("description");


    const modeButton =
        document.getElementById("modeButton");


    if(perfil.modo === "estudo"){

        let detalhe =
            perfil.nivel === "faculdade"
            ? perfil.curso
            : perfil.serie;


        description.textContent =
            "O Vetrix está adaptado para seus estudos" +
            (detalhe ? " — " + detalhe : "") +
            ". Faça perguntas, peça explicações, resumos, exercícios e muito mais.";


        modeButton.innerHTML =
            '🏠 <span class="label">Modo Base</span>';

    }else{

        description.textContent =
            "Pode fazer perguntas, tirar dúvidas, pedir ideias, conversar e muito mais. Estou aqui para te ajudar.";


        modeButton.innerHTML =
            '📚 <span class="label">Modo Estudo</span>';

    }

}


/* =========================
   TROCAR MODO
========================= */

function trocarModo(){

    if(!perfil){

        iniciarOnboarding();

        return;
    }


    if(perfil.modo === "estudo"){

        perfil.modo = "base";

        localStorage.setItem(
            KEY,
            JSON.stringify(perfil)
        );

        aplicarPerfil();

        return;
    }


    if(perfil.nivel){

        perfil.modo = "estudo";

        localStorage.setItem(
            KEY,
            JSON.stringify(perfil)
        );

        aplicarPerfil();

        return;
    }


    dados = {
        modo:"estudo",
        nivel:null,
        serie:"",
        curso:"",
        periodo:"",
        objetivos:[],
        outroObjetivo:"",
        primeiroAcessoConcluido:false
    };


    entradaModo = null;

    iniciarOnboarding();

}


/* =========================
   PREENCHER
========================= */

function preencher(texto){

    const question =
        document.getElementById("question");

    question.value = texto;

    question.focus();

}


/* =========================
   ENVIAR
========================= */

function enviar(){

    const question =
        document.getElementById("question");

    const response =
        document.getElementById("response");


    const texto =
        question.value.trim();


    if(!texto){

        return;
    }


    response.style.display = "block";


    response.innerHTML = `

        <b style="color:var(--orange)">
            Vetrix:
        </b>

        <br><br>

        Recebi sua pergunta:
        “${esc(texto)}”

        <br><br>

        <span style="color:var(--dim)">
            A API será conectada na próxima etapa
            para gerar respostas reais.
        </span>

    `;


    question.value = "";

}


/* =========================
   NOVA CONVERSA
========================= */

function novaConversa(){

    document.getElementById("question").value = "";

    document.getElementById("response")
        .style.display = "none";

    document.getElementById("question")
        .focus();

}


/* =========================
   HISTÓRICO
========================= */

function mostrarHistorico(){

    alert(
        "O histórico será ativado junto com a próxima etapa do Vetrix."
    );

}


/* =========================
   CONFIGURAÇÕES
========================= */

function configuracoes(){

    alert(
        "As configurações do Vetrix serão adicionadas em breve."
    );

}


/* =========================
   AJUDA
========================= */

function ajuda(){

    alert(
        "Use o campo de mensagem para conversar com o Vetrix."
    );

}


/* =========================
   ENTER
========================= */

document
    .getElementById("question")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                enviar();

            }

        }
    );


/* =========================
   INICIALIZAÇÃO
========================= */

if(
    perfil &&
    perfil.primeiroAcessoConcluido
){

    aplicarPerfil();

}else{

    iniciarOnboarding();

}

</script>

</body>
</html>
