



<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vetrix AI - Estudos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 120, 0, 0.12), transparent 35%),
        #030303;
      color: white;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */

    .topo {
      height: 75px;
      border-bottom: 1px solid #ff7a00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
      background: rgba(0, 0, 0, 0.92);
      box-shadow: 0 0 20px rgba(255, 110, 0, 0.15);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo-v {
      width: 42px;
      height: 42px;
      border: 2px solid #ff7800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff7800;
      font-size: 25px;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.5);
    }

    .logo span {
      color: #ff7800;
    }

    .voltar {
      text-decoration: none;
      color: white;
      border: 1px solid #ff7800;
      padding: 10px 20px;
      border-radius: 7px;
      font-size: 14px;
      transition: 0.2s;
    }

    .voltar:hover {
      background: #ff7800;
      color: black;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.6);
    }

    /* ÁREA PRINCIPAL */

    .principal {
      height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      padding: 25px;
    }

    .chat {
      width: min(1000px, 100%);
      height: 100%;
      border: 1px solid #ff7800;
      border-radius: 12px;
      background: rgba(8, 8, 8, 0.95);
      box-shadow:
        0 0 25px rgba(255, 100, 0, 0.12),
        inset 0 0 25px rgba(255, 100, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* CABEÇALHO DO CHAT */

    .chat-header {
      padding: 18px 25px;
      border-bottom: 1px solid rgba(255, 120, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .robot {
      width: 48px;
      height: 48px;
      border: 2px solid #ff7800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.35);
    }

    .chat-header h1 {
      font-size: 18px;
    }

    .chat-header p {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    /* MENSAGENS */

    .mensagens {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mensagem {
      max-width: 75%;
      padding: 14px 17px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 15px;
    }

    .bot {
      align-self: flex-start;
      border: 1px solid rgba(255, 120, 0, 0.45);
      background: #101010;
    }

    .usuario {
      align-self: flex-end;
      background: #ff7800;
      color: black;
      font-weight: 500;
    }

    /* SUGESTÕES */

    .sugestoes {
      padding: 0 25px 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sugestao {
      background: transparent;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }

    .sugestao:hover {
      border-color: #ff7800;
      color: #ff7800;
    }

    /* ÁREA DE DIGITAÇÃO */

    .entrada {
      padding: 18px;
      border-top: 1px solid rgba(255, 120, 0, 0.5);
      display: flex;
      gap: 10px;
      background: #070707;
    }

    #texto {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 14px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #texto:focus {
      border-color: #ff7800;
      box-shadow: 0 0 10px rgba(255, 120, 0, 0.15);
    }

    #enviar {
      width: 55px;
      border: none;
      border-radius: 8px;
      background: #ff7800;
      color: black;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #enviar:hover {
      transform: scale(1.04);
      box-shadow: 0 0 18px rgba(255, 120, 0, 0.5);
    }

    /* CELULAR */

    @media (max-width: 600px) {

      .topo {
        padding: 0 15px;
      }

      .logo {
        font-size: 20px;
      }

      .voltar {
        padding: 8px 12px;
      }

      .principal {
        padding: 10px;
      }

      .mensagem {
        max-width: 88%;
      }

      .sugestoes {
        padding: 0 12px 12px;
      }

      .entrada {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="topo">

    <div class="logo">
      <div class="logo-v">V</div>
      VETRIX <span>AI</span>
    </div>

    <a href="index.html" class="voltar">
      ← Início
    </a>

  </header>


  <main class="principal">

    <section class="chat">

      <div class="chat-header">

        <div class="robot">🤖</div>

        <div>
          <h1>Vetrix AI</h1>
          <p>Seu assistente de estudos</p>
        </div>

      </div>


      <div class="mensagens" id="mensagens">

        <div class="mensagem bot">
          👋 Olá! Eu sou o <strong>Vetrix AI</strong>.<br><br>
          Posso ajudar você a estudar, explicar assuntos,
          criar exercícios, fazer resumos e muito mais.
          <br><br>
          O que você quer estudar hoje?
        </div>

      </div>


      <div class="sugestoes">

        <button class="sugestao" onclick="sugestao('Explique matemática para mim')">
          📐 Matemática
        </button>

        <button class="sugestao" onclick="sugestao('Me ajude com História')">
          🏛️ História
        </button>

        <button class="sugestao" onclick="sugestao('Me ajude com Português')">
          📖 Português
        </button>

        <button class="sugestao" onclick="sugestao('Crie exercícios para eu estudar')">
          📝 Exercícios
        </button>

        <button class="sugestao" onclick="sugestao('Faça um resumo para mim')">
          📚 Resumo
        </button>

      </div>


      <div class="entrada">

        <input
          id="texto"
          type="text"
          placeholder="Digite sua pergunta..."
          autocomplete="off"
        >

        <button id="enviar" onclick="enviarMensagem()">
          ➤
        </button>

      </div>

    </section>

  </main>


  <script>

    const texto = document.getElementById("texto");
    const mensagens = document.getElementById("mensagens");


    function adicionarMensagem(conteudo, tipo) {

      const div = document.createElement("div");

      div.className = "mensagem " + tipo;

      div.innerHTML = conteudo;

      mensagens.appendChild(div);

      mensagens.scrollTop = mensagens.scrollHeight;
    }


    function responder(pergunta) {

      const p = pergunta.toLowerCase();

      if (
        p.includes("oi") ||
        p.includes("olá") ||
        p.includes("ola")
      ) {
        return "Olá! 👋 Que bom ter você aqui. O que vamos estudar hoje?";
      }

      if (p.includes("matemática") || p.includes("matematica")) {
        return "📐 Claro! Posso ajudar com matemática. Me diga qual assunto você está estudando.";
      }

      if (p.includes("história") || p.includes("historia")) {
        return "🏛️ Posso explicar História de forma simples e organizada. Qual período ou assunto você quer estudar?";
      }

      if (p.includes("português") || p.includes("portugues")) {
        return "📖 Vamos estudar Português! Posso ajudar com gramática, interpretação de texto, literatura e muito mais.";
      }

      if (p.includes("exercício") || p.includes("exercicio")) {
        return "📝 Posso criar exercícios para você. Me diga a matéria e o assunto.";
      }

      if (p.includes("resumo")) {
        return "📚 Posso fazer um resumo. Mande o texto ou diga qual assunto você quer resumir.";
      }

      if (p.includes("quem criou") || p.includes("criador")) {
        return "🤖 Fui criado por Luís Felipe Lira e Daniel Perez.";
      }

      if (p.includes("seu nome")) {
        return "Meu nome é Vetrix AI. 🧠";
      }

      return "Entendi! 🤖 Me conte um pouco mais sobre o que você precisa estudar e vou tentar ajudar.";
    }


    function enviarMensagem() {

      const pergunta = texto.value.trim();

      if (pergunta === "") {
        return;
      }

      adicionarMensagem(pergunta, "usuario");

      texto.value = "";

      setTimeout(() => {

        const resposta = responder(pergunta);

        adicionarMensagem(resposta, "bot");

      }, 500);
    }


    function sugestao(pergunta) {

      texto.value = pergunta;

      enviarMensagem();

    }


    texto.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        enviarMensagem();
      }

    });

  </script>

</body>
</html>
