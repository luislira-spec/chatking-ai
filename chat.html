


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vetrix AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080706;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* =========================
   TOPO
========================= */

.topo {
    height: 118px;
    border-bottom: 1px solid #392719;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 31px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 24px;
    font-weight: bold;
}

.logo-v {
    width: 40px;
    height: 40px;
    border: 2px solid #ff7900;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff7900;
    font-size: 25px;
}

.logo-ai {
    color: #ff7900;
}

.topo-direita {
    display: flex;
    gap: 14px;
}

.usuario,
.inicio {
    height: 49px;
    border: 1px solid #88450d;
    border-radius: 6px;
    background: #090807;
    color: #eeeeee;
    display: flex;
    align-items: center;
    padding: 0 18px;
    text-decoration: none;
    font-size: 14px;
}

.usuario:hover,
.inicio:hover {
    border-color: #ff7900;
}

/* =========================
   LAYOUT
========================= */

.layout {
    display: flex;
    min-height: calc(100vh - 118px);
}

/* =========================
   MENU LATERAL
========================= */

.sidebar {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid #392719;
    padding: 25px 16px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu a {
    text-decoration: none;
    color: #bdbdbd;
    font-size: 15px;
    padding: 14px 16px;
    border-radius: 6px;
    display: block;
}

.menu a:hover {
    color: white;
    background: #15100c;
}

.menu .ativo {
    color: #ff8a19;
    background: #1c1008;
    border: 1px solid #87430c;
}

.separador {
    height: 1px;
    background: #392719;
    margin: 30px 25px;
}

.modo {
    color: #bbbbbb;
    padding: 10px 18px;
    font-size: 15px;
}

.modo span {
    color: #ff7900;
}

/* =========================
   CONTEÚDO PRINCIPAL
========================= */

.conteudo {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 62px 35px 25px;
}

/* LOGO CENTRAL */

.logo-central {
    width: 96px;
    height: 96px;
    border: 2px solid #ff7900;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ff7900;
    font-size: 48px;
    font-weight: bold;

    margin-bottom: 25px;
}

/* TÍTULO */

.titulo {
    font-size: 34px;
    margin-bottom: 14px;
}

.titulo span {
    color: #ff7900;
}

.status {
    font-size: 19px;
    margin-bottom: 12px;
}

.status span {
    color: #ff7900;
    font-weight: bold;
}

.descricao {
    max-width: 700px;
    text-align: center;
    color: #999999;
    font-size: 16px;
    line-height: 1.6;
}

/* =========================
   CAIXA DE PERGUNTA
========================= */

.caixa-pergunta {
    width: min(945px, 100%);
    height: 72px;

    margin-top: 46px;

    border: 1px solid #8b470d;
    border-radius: 9px;

    background: #0d0a08;

    display: flex;
    align-items: center;

    padding: 10px 12px 10px 20px;
}

.icone {
    font-size: 21px;
    margin-right: 14px;
}

#pergunta {
    flex: 1;

    height: 100%;

    background: transparent;
    border: none;
    outline: none;

    color: white;
    font-size: 16px;
}

#pergunta::placeholder {
    color: #777777;
}

#enviar {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 6px;

    background: #ff7900;
    color: black;

    font-size: 20px;
    cursor: pointer;
}

#enviar:hover {
    background: #ff8b20;
}

/* =========================
   MENSAGENS
========================= */

.respostas {
    width: min(945px, 100%);
    margin-top: 20px;
}

.mensagem {
    padding: 14px 17px;
    border: 1px solid #392719;
    border-radius: 7px;
    margin-bottom: 10px;
    background: #0c0a09;
    line-height: 1.5;
}

.mensagem.usuario {
    border-left: 3px solid #ff7900;
}

.mensagem.vetrix {
    border-left: 3px solid #70400e;
}

/* =========================
   RODAPÉ
========================= */

.rodape {
    margin-top: auto;
    padding-top: 45px;

    color: #777777;
    font-size: 13px;
}

.rodape strong {
    color: #dddddd;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .topo {
        height: 80px;
        padding: 0 15px;
    }

    .logo {
        font-size: 19px;
    }

    .logo-v {
        width: 34px;
        height: 34px;
        font-size: 20px;
    }

    .usuario {
        display: none;
    }

    .layout {
        min-height: calc(100vh - 80px);
    }

    .sidebar {
        display: none;
    }

    .conteudo {
        padding: 45px 18px 20px;
    }

    .titulo {
        font-size: 28px;
    }

    .descricao {
        font-size: 14px;
    }

    .caixa-pergunta {
        margin-top: 35px;
    }

}

</style>
</head>


<body>


<!-- =========================
     TOPO
========================= -->

<header class="topo">

    <div class="logo">

        <div class="logo-v">V</div>

        <div>
            VETRIX <span class="logo-ai">AI</span>
        </div>

    </div>


    <div class="topo-direita">

        <div class="usuario">
            👤 Luís⌄
        </div>

        <a href="index.html" class="inicio">
            🏠 INÍCIO
        </a>

    </div>

</header>



<!-- =========================
     LAYOUT
========================= -->

<div class="layout">


    <!-- MENU -->

    <aside class="sidebar">

        <nav class="menu">

            <a href="chat.html" class="ativo">
                🏠 Início
            </a>

            <a href="chat.html">
                💬 Nova conversa
            </a>

            <a href="#">
                📖 Histórico
            </a>

            <a href="#">
                ⚙️ Configurações
            </a>

            <a href="#">
                ❓ Ajuda
            </a>

        </nav>


        <div class="separador"></div>


        <div class="modo">
            🎓 <span>Modo Estudo</span>
        </div>

    </aside>



    <!-- CONTEÚDO -->

    <main class="conteudo">


        <div class="logo-central">
            V
        </div>


        <h1 class="titulo">
            Olá, <span>Luís!</span>
        </h1>


        <div class="status">
            Você está no <span>modo normal.</span>
        </div>


        <p class="descricao">
            Pode fazer perguntas, tirar dúvidas, pedir ideias,
            conversar e muito mais. Estou aqui para te ajudar!
        </p>



        <!-- CAIXA DE PERGUNTA -->

        <div class="caixa-pergunta">

            <div class="icone">
                ✨
            </div>


            <input
                id="pergunta"
                type="text"
                placeholder="Digite sua pergunta..."
            >


            <button id="enviar" onclick="enviarPergunta()">
                ➤
            </button>

        </div>



        <!-- RESPOSTAS -->

        <div class="respostas" id="respostas"></div>



        <!-- RODAPÉ -->

        <div class="rodape">
            Feito por
            <strong>Luís Felipe Lira e Daniel Perez.</strong>
        </div>


    </main>

</div>



<script>

function enviarPergunta() {

    const campo = document.getElementById("pergunta");

    const texto = campo.value.trim();

    if (texto === "") {
        return;
    }


    const respostas = document.getElementById("respostas");


    const pergunta = document.createElement("div");

    pergunta.className = "mensagem usuario";

    pergunta.textContent = texto;

    respostas.appendChild(pergunta);


    campo.value = "";


    const resposta = document.createElement("div");

    resposta.className = "mensagem vetrix";

    resposta.textContent =
        "Recebi sua pergunta! A conexão com a inteligência do Vetrix será adicionada quando a API estiver configurada. 🤖";

    respostas.appendChild(resposta);


    resposta.scrollIntoView({
        behavior: "smooth"
    });

}


document.getElementById("pergunta").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            enviarPergunta();
        }

    }
);

</script>


</body>
</html>
