


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vetrix AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080706;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* TOPO */

.topo {
    height: 118px;
    border-bottom: 1px solid #3a291c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: bold;
}

.logo-v {
    width: 40px;
    height: 40px;
    border: 2px solid #ff7900;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff7900;
    font-size: 24px;
}

.logo-ai {
    color: #ff7900;
}

.topo-direita {
    display: flex;
    gap: 14px;
}

.usuario,
.inicio {
    border: 1px solid #8b430b;
    background: #090807;
    color: white;
    border-radius: 6px;
    padding: 13px 20px;
    text-decoration: none;
    font-size: 14px;
}

.usuario:hover,
.inicio:hover {
    border-color: #ff7900;
}

/* LAYOUT */

.layout {
    display: flex;
    min-height: calc(100vh - 118px);
}

/* MENU LATERAL */

.sidebar {
    width: 250px;
    border-right: 1px solid #3a291c;
    padding: 25px 16px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.menu a {
    color: #bdbdbd;
    text-decoration: none;
    padding: 14px 15px;
    border-radius: 6px;
    font-size: 15px;
}

.menu a:hover {
    color: white;
    background: #17100b;
}

.menu .ativo {
    color: #ff8a18;
    background: #1c1007;
    border: 1px solid #88430b;
}

.separador {
    height: 1px;
    background: #3a291c;
    margin: 28px 0;
}

.modo {
    color: #aaa;
    padding: 12px 15px;
    font-size: 15px;
}

.modo span {
    color: #ff7900;
}

/* CONTEÚDO */

.conteudo {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 30px 30px;
}

/* V CENTRAL */

.v-central {
    width: 95px;
    height: 95px;
    border: 2px solid #ff7900;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff7900;
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 25px;
    box-shadow: 0 0 20px rgba(255,121,0,0.12);
}

/* TEXTO */

h1 {
    font-size: 34px;
    margin-bottom: 14px;
}

h1 span {
    color: #ff7900;
}

.status {
    font-size: 19px;
    margin-bottom: 12px;
}

.status span {
    color: #ff7900;
    font-weight: bold;
}

.descricao {
    color: #aaa;
    text-align: center;
    max-width: 650px;
    line-height: 1.6;
    font-size: 16px;
}

/* CAIXA DE PERGUNTA */

.pergunta-area {
    width: min(945px, 100%);
    margin-top: 45px;
    border: 1px solid #8b430b;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0a08;
}

.estrela {
    color: #ffb000;
    font-size: 20px;
}

#pergunta {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
}

#pergunta::placeholder {
    color: #777;
}

#enviar {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 6px;
    background: #ff7900;
    color: black;
    font-size: 20px;
    cursor: pointer;
}

#enviar:hover {
    background: #ff8d26;
}

/* RESPOSTAS */

#respostas {
    width: min(945px, 100%);
    margin-top: 20px;
}

.mensagem {
    background: #0e0b09;
    border: 1px solid #3a291c;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
}

.usuario-msg {
    border-left: 3px solid #ff7900;
}

.bot-msg {
    border-left: 3px solid #8b430b;
}

/* RODAPÉ */

.rodape {
    margin-top: auto;
    padding-top: 45px;
    color: #777;
    font-size: 13px;
}

.rodape strong {
    color: #ddd;
}

/* CELULAR */

@media (max-width: 700px) {

    .topo {
        height: 85px;
        padding: 0 15px;
    }

    .logo {
        font-size: 20px;
    }

    .usuario {
        display: none;
    }

    .layout {
        min-height: calc(100vh - 85px);
    }

    .sidebar {
        display: none;
    }

    .conteudo {
        padding: 45px 18px 20px;
    }

    h1 {
        font-size: 28px;
    }

    .descricao {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header class="topo">

    <div class="logo">
        <div class="logo-v">V</div>
        <div>
            VETRIX <span class="logo-ai">AI</span>
        </div>
    </div>

    <div class="topo-direita">
        <div class="usuario">👤 Luís⌄</div>

        <a href="index.html" class="inicio">
            🏠 INÍCIO
        </a>
    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <nav class="menu">

            <a href="chat.html" class="ativo">
                🏠 Início
            </a>

            <a href="chat.html">
                💬 Nova conversa
            </a>

            <a href="#">
                📖 Histórico
            </a>

            <a href="#">
                ⚙️ Configurações
            </a>

            <a href="#">
                ❓ Ajuda
            </a>

        </nav>

        <div class="separador"></div>

        <div class="modo">
            🎓 <span>Modo Estudo</span>
        </div>

    </aside>


    <main class="conteudo">

        <div class="v-central">
            V
        </div>

        <h1>
            Olá, <span>Luís!</span>
        </h1>

        <div class="status">
            Você está no <span>modo normal.</span>
        </div>

        <p class="descricao">
            Pode fazer perguntas, tirar dúvidas, pedir ideias,
            conversar e muito mais. Estou aqui para te ajudar!
        </p>


        <div class="pergunta-area">

            <div class="estrela">✨</div>

            <input
                id="pergunta"
                type="text"
                placeholder="Digite sua pergunta..."
            >

            <button id="enviar" onclick="enviarPergunta()">
                ➤
            </button>

        </div>


        <div id="respostas"></div>


        <div class="rodape">
            Feito por <strong>Luís Felipe Lira e Daniel Perez.</strong>
        </div>

    </main>

</div>


<script>

function enviarPergunta() {

    const campo = document.getElementById("pergunta");
    const texto = campo.value.trim();

    if (texto === "") {
        return;
    }

    const respostas = document.getElementById("respostas");

    const usuario = document.createElement("div");
    usuario.className = "mensagem usuario-msg";
    usuario.textContent = texto;

    respostas.appendChild(usuario);

    campo.value = "";

    const resposta = document.createElement("div");
    resposta.className = "mensagem bot-msg";
    resposta.textContent =
        "Recebi sua pergunta! Quando a API do Vetrix estiver conectada, vou poder responder de verdade. 🤖";

    respostas.appendChild(resposta);

    resposta.scrollIntoView({
        behavior: "smooth"
    });
}


document.getElementById("pergunta").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            enviarPergunta();
        }

    }
);

</script>

</body>
</html>
